name: Counterexample or unsound claim
description: Challenge a mathematical theorem, proof step, checker decision, or public claim.
title: "[counterexample]: "
labels: ["counterexample", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Mathematical counterexamples and refutations are welcome evidence. Do not publish exploit details or sensitive data; use private vulnerability reporting when appropriate.
  - type: input
    id: claim
    attributes:
      label: Challenged claim and coordinate
      placeholder: File/section, Lean module, or theorem name, plus release or commit
    validations:
      required: true
  - type: textarea
    id: counterexample
    attributes:
      label: Counterexample or model
      description: Provide the smallest formula, Lean code, or reasoning that contradicts the claim.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected bounded result
      description: State PASS, FAIL, UNKNOWN, UNSUPPORTED, or corrected wording and why.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction procedure
    validations:
      required: false
