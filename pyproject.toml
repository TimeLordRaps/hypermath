[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypermath-foundations"
version = "0.1.0"
description = "Bounded evidence audits for the Hypermath formalization"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tyler Roost"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "build>=1.2", "ruff>=0.9", "twine>=6"]
verification = ["verifier-standard==1.3.0"]

[project.scripts]
hypermath-foundations = "hypermath_foundations.__main__:main"

[project.urls]
Repository = "https://github.com/TimeLordRaps/hypermath"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
